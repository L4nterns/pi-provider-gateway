name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install native PTY and Pi tools for offline UI checks
        run: |
          sudo apt-get update
          sudo apt-get install -y util-linux ripgrep fd-find
      - name: Install test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check types and run isolated tests
        run: |
          npm run check
          npm test
